name: build-extension
on:
  push:
    tags:
      - 'v*'

# Needed so the release step can upload assets
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: extension
        run: npm install --no-audit --no-fund

      - name: Unit tests
        working-directory: extension
        run: npm test

      - name: Build extension
        working-directory: extension
        run: npm run build

      - name: Create Chrome Web Store ZIP
        working-directory: extension/dist
        run: |
          # Create ZIP with files at root level (Chrome Web Store requirement)
          zip -r phishguard-lite-${GITHUB_REF_NAME}.zip *

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: phishguard-lite-${{ github.ref_name }}
          path: extension/dist/phishguard-lite-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: extension/dist/phishguard-lite-${{ github.ref_name }}.zip
