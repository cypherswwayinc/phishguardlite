<!doctype html><html><head><meta charset="utf-8"><style>
html{margin:0;background:#EDF1F4;overflow:hidden}html:has(body.dark){background:#13233A}body{margin:0;width:1920px;height:1080px;zoom:0.4166667;position:relative;background:#EDF1F4;color:#13233A;font-family:Inter,Arial,sans-serif}
body{display:flex;flex-direction:column;justify-content:center;padding:0 150px;box-sizing:border-box}
body.dark{background:#13233A;color:#fff}
h1{font:800 104px/1.03 'Inter Display',Inter,sans-serif;letter-spacing:-.035em;margin:0;max-width:1500px}
h2{font:800 84px/1.05 'Inter Display',Inter,sans-serif;letter-spacing:-.03em;margin:0;max-width:1500px}
p{font:500 40px/1.4 Inter,sans-serif;margin:34px 0 0;max-width:1300px;color:#4A5A70}
.dark p{color:#B9C6D6}
.brand{position:absolute;left:150px;top:90px;font:700 34px 'Inter Display',Inter,sans-serif;letter-spacing:-.01em}
.url{display:inline-block;margin-top:54px;padding:22px 40px;border-radius:999px;background:#fff;color:#13233A;font:700 46px 'Inter Display',Inter,sans-serif;letter-spacing:-.01em}
.row{display:flex;gap:70px;margin-top:20px}.col{flex:1}.col h3{font:800 60px/1.1 'Inter Display',Inter,sans-serif;letter-spacing:-.02em;margin:0}.col p{margin-top:14px;font-size:34px}
.foot{position:absolute;left:150px;bottom:80px;font:500 28px Inter,sans-serif;color:#B9C6D6}
html.v body,body.v{width:1080px;height:1920px;padding:0 90px}
body.v h1{font-size:112px}body.v h2{font-size:96px}body.v p{font-size:46px}
body.v .brand{left:90px;top:130px;font-size:40px}body.v .row{flex-direction:column;gap:70px;margin-top:0}
body.v .col h3{font-size:76px}body.v .col p{font-size:42px}body.v .url{font-size:50px;margin-top:80px}
body.v .foot{left:90px;bottom:120px;font-size:32px}
</style></head><body></body></html>
